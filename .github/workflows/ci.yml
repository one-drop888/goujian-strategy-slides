name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    name: Core-only (Node ${{ matrix.node }}, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - node: 18
            python: '3.9'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared Linux font prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y fontconfig fonts-noto-core fonts-noto-cjk
      - run: npm ci
      - name: Core tier without Pillow or render dependencies
        run: npm run test:core
      - name: Package and preflight the actual runtime and source archives
        run: |
          set -euo pipefail
          mkdir -p out dist
          python3 scripts/package_runtime.py dist/runtime.zip --json > out/runtime-package.json
          python3 scripts/package_runtime.py dist/source.zip --source --json > out/source-package.json
          python3 - <<'PY'
          import json, subprocess, zipfile
          from pathlib import Path
          prefix = 'goujian-strategy-slides/'
          mapping_path = Path('distribution/runtime-package.json')
          mapping = json.loads(mapping_path.read_text(encoding='utf-8'))
          root_package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          for field in ('name', 'version', 'license', 'dependencies', 'engines', 'overrides', 'repository'):
              assert mapping.get(field) == root_package.get(field), f'runtime package mapping differs for {field}'
          def verify(path, mapped_package):
              with zipfile.ZipFile(Path(path)) as archive:
                  names = archive.namelist()
                  assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
                  for name in names:
                      relative = name[len(prefix):] if name.startswith(prefix) else None
                      assert relative, f'archive member outside the declared prefix: {name}'
                      if relative == 'package.json' and mapped_package:
                          expected = mapping_path.read_bytes()
                      else:
                          expected = subprocess.run(['git', 'show', f'HEAD:{relative}'],
                                                    check=True, capture_output=True).stdout
                      assert archive.read(name) == expected, f'{relative} differs from HEAD'
                  return len(names)
          runtime_count = verify('dist/runtime.zip', True)
          source_count = verify('dist/source.zip', False)
          print(f'PASS: runtime={runtime_count} source={source_count} members match HEAD; package.json mapped only for runtime')
          PY
          python3 scripts/security_preflight.py dist/runtime.zip --profile runtime --strict-manifest --json out/runtime-preflight.json
          python3 scripts/security_preflight.py dist/source.zip --profile source --json out/source-preflight.json
      - name: Clean-install the actual runtime ZIP without linked node_modules
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/构见-ci-runtime-clean-install"
          rm -rf "$install_root"
          python3 - "$install_root" dist/runtime.zip <<'PY'
          import json
          import stat
          import sys
          import zipfile
          from pathlib import Path

          target = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          prefix = 'goujian-strategy-slides/'
          with zipfile.ZipFile(archive) as source:
              infos = source.infolist()
              names = [info.filename for info in infos]
              assert names and len(names) == len(set(names))
              assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
              for info in infos:
                  name = info.filename
                  assert name.startswith(prefix), f'member outside the declared prefix: {name}'
                  assert not info.is_dir(), f'unexpected directory entry: {name}'
                  mode = (info.external_attr >> 16) & 0xFFFF
                  assert not stat.S_ISLNK(mode), f'symlink member: {name}'
                  relative = name[len(prefix):]
                  assert not relative.startswith(('node_modules/', '.venv/', 'out/', 'dist/')), f'install-state member: {name}'
              target.mkdir(parents=True)
              source.extractall(target)
          root = target / 'goujian-strategy-slides'
          assert root.is_dir()
          assert not (root / 'node_modules').exists()
          assert not (root / '.venv').exists()
          assert not (root / '.github').exists()
          assert not (root / 'tests/test_capability_parity.py').exists()
          manifest = json.loads((root / 'distribution/runtime-manifest.json').read_text(encoding='utf-8'))
          files = manifest['runtime_files']
          assert manifest['distribution'] == 'runtime'
          assert len(files) == 185 and len(set(files)) == 185
          assert 'package.json' not in files
          assert len(names) == 186
          assert 'scripts/package_runtime.py' not in files
          assert 'scripts/security_preflight.py' not in files
          assert (root / 'package.json').read_bytes() == (root / 'distribution/runtime-package.json').read_bytes()
          print(f'PASS: extracted {len(names)} runtime members into a Unicode directory; no node_modules, .venv, symlink or development overlay')
          PY
          cd "$install_root/goujian-strategy-slides"
          test -z "$(find . -type l -print -quit)"
          test ! -e node_modules
          test ! -e .venv
          empty_npmrc="$RUNNER_TEMP/goujian-empty-npmrc"
          : > "$empty_npmrc"
          export NPM_CONFIG_USERCONFIG="$empty_npmrc"
          python3 scripts/bootstrap.py --python "$(command -v python3)" --json > "$RUNNER_TEMP/ci-bootstrap.json"
          python3 - "$RUNNER_TEMP/ci-bootstrap.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['status'] == 'READY', data
          assert data['tier'] == 'core', data['tier']
          assert data['secure_image'] == 'UNAVAILABLE', data['secure_image']
          assert data['pillow'] is None, data['pillow']
          actions = {action['step']: action for action in data['actions']}
          assert actions['npm-ci']['status'] == 'OK', actions['npm-ci']
          assert actions['venv']['status'] == 'OK', actions['venv']
          assert actions['pip-install']['status'] == 'SKIPPED', actions['pip-install']
          print('PASS: core Bootstrap installed locked npm dependencies in the extracted runtime; no Pillow fallback was installed')
          PY
          . .venv/bin/activate
          python3 - <<'PY'
          import sys
          assert sys.prefix != sys.base_prefix, sys.prefix
          print(f'PASS: core runtime commands use isolated {sys.prefix}')
          PY
          npm run test:core | tee "$RUNNER_TEMP/ci-runtime-smoke-core.log"
          python3 - "$RUNNER_TEMP/ci-runtime-smoke-core.log" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          lines = [line.rstrip() for line in text.splitlines() if line.strip()]
          assert 'runtime smoke: PASS (core tier); VISUAL_QA=NOT_RUN' in text, text[-1200:]
          assert not any(line.startswith('FAIL') for line in lines), [line for line in lines if line.startswith('FAIL')]
          not_run = {line.split()[1].rstrip(':') for line in lines if line.startswith('NOT_RUN')}
          expected = {'qa:analytics', 'plan:compile', 'font:measure', 'image:prepare',
                      'build:multimodal', 'qa:multimodal', 'render:multimodal'}
          assert not_run == expected, (not_run, expected)
          print('PASS: core installed-runtime smoke passed and disclosed the seven Pillow/image steps as NOT_RUN')
          PY
          npm run validate:all
          npm run --silent doctor -- --json > "$RUNNER_TEMP/ci-doctor.json"
          python3 - "$RUNNER_TEMP/ci-doctor.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['status'] in {'READY', 'READY_WITH_NOTES'}, data['status']
          checks = {check['id']: check for check in data['checks']}
          assert checks['js-dependencies']['status'] == 'PRESENT', checks['js-dependencies']
          assert checks['venv']['status'] == 'PRESENT', checks['venv']
          assert checks['secure-image']['status'] != 'PRESENT', checks['secure-image']
          assert data['visual_qa'] in {'NOT_RUN', 'UNAVAILABLE'}, data['visual_qa']
          print('PASS: Doctor reports the isolated core tier honestly; secure-image is not claimed; VISUAL_QA is not approved')
          PY
          digest="$(sha256sum "$GITHUB_WORKSPACE/dist/runtime.zip" | cut -d' ' -f1)"
          python3 "$GITHUB_WORKSPACE/scripts/package_runtime.py" "$RUNNER_TEMP/ci-runtime-rebuilt.zip" \
            --runtime-root "$PWD" --expect-sha256 "$digest" --json > "$RUNNER_TEMP/ci-runtime-rebuilt.json"
          python3 - "$RUNNER_TEMP/ci-runtime-rebuilt.json" "$digest" <<'PY'
          import json
          import sys
          from pathlib import Path

          rebuilt = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert rebuilt['entries'] == 186, rebuilt['entries']
          assert rebuilt['sha256'] == sys.argv[2], (rebuilt['sha256'], sys.argv[2])
          print('PASS: the Source packager reproduced the installed runtime byte-identically from data only')
          PY

  secure:
    name: Secure image tier (Node ${{ matrix.node }}, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - node: 18
            python: '3.11'
          - node: 24
            python: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared Linux font prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y fontconfig fonts-noto-core fonts-noto-cjk
      - name: Install V1.3 render prerequisites on the full-runtime leg
        if: matrix.node == 24
        run: sudo apt-get install -y libreoffice-impress poppler-utils imagemagick
      - run: npm ci
      - run: python3 -m pip install -r requirements-render.txt
      - run: npm test
      - run: npm run benchmark
      - name: V1.3 matrix, dogfood and public showcase without a baseline
        if: matrix.node == 24
        run: |
          set -euo pipefail
          mkdir -p out dist
          node scripts/build_showcase.js --no-previews | tee out/v13-public-showcase-summary.json
          node - <<'JS'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('out/v1.3-showcase/showcase.manifest.json', 'utf8'));
          if (manifest.version !== '1.3.2') throw new Error('showcase version is not 1.3.2');
          if (manifest.baseline !== null) throw new Error('Public showcase must not use a baseline path');
          if (!manifest.scenarios.length || !manifest.scenarios.every(item => item.comparison.status === 'NOT_RUN')) throw new Error('Public showcase comparison must be NOT_RUN');
          if (!(manifest.matrix.status === 'PASS' && manifest.gallery.status === 'PASS' && manifest.ledger.status === 'PASS')) throw new Error('A public V1.3 suite is not PASS');
          if (manifest.matrix?.fixture_counts?.cells !== 96 || manifest.matrix?.fixture_counts?.accepted !== 72 || manifest.matrix?.fixture_counts?.rejected !== 24) throw new Error('The native chart matrix no longer reports 96/72/24 outcomes');
          const relationships = JSON.parse(fs.readFileSync('out/v1.3-showcase/relationships/manifest.json', 'utf8'));
          if (relationships.status !== 'PASS' || relationships.outputs.length !== 8) throw new Error('Relationship evidence is incomplete');
          if (relationships.visual_qa !== 'NOT_RUN') throw new Error('Relationship evidence must not claim a visual pass');
          const preview = JSON.parse(fs.readFileSync('docs/visual/v1.3/preview-manifest.json', 'utf8'));
          if (preview.review.status !== 'NOT_RUN') throw new Error('Preview review must remain NOT_RUN');
          const fingerprint = JSON.parse(fs.readFileSync('out/v1.3-showcase/engine-source-fingerprint.json', 'utf8'));
          if (preview.engine_source_fingerprint?.aggregate_sha256 !== fingerprint.aggregate_sha256) throw new Error('Checked-in previews are stale for this engine source');
          JS
      - name: Tagged V1.3.0/V1.3.1 baselines and both capability parity contracts
        if: matrix.node == 24
        run: |
          set -euo pipefail
          V13_BASELINE_COMMIT=f592ff82b2399fb3e08f3d9128f92a1d82039065
          V13_BASELINE_TAG_OBJECT=5af41b05281c043dded880fc2ffe19ddb69f667c
          V131_BASELINE_COMMIT=25f269f8db333e27f23915ecb472eed6cb2709c6
          V131_BASELINE_TAG_OBJECT=72df06c921a80bbe1128a0964f22e187811943c6
          git fetch --tags origin
          if ! git rev-parse -q --verify refs/tags/v1.3.0 >/dev/null; then
            git fetch --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          fi
          if ! git rev-parse -q --verify refs/tags/v1.3.1 >/dev/null; then
            git fetch --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          fi
          test "$(git cat-file -t refs/tags/v1.3.0)" = tag
          test "$(git rev-parse refs/tags/v1.3.0)" = "$V13_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.3.0^{commit}')" = "$V13_BASELINE_COMMIT"
          test "$(git cat-file -t refs/tags/v1.3.1)" = tag
          test "$(git rev-parse refs/tags/v1.3.1)" = "$V131_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.3.1^{commit}')" = "$V131_BASELINE_COMMIT"
          for release in v1.3.0 v1.3.1; do
            release_parent="$RUNNER_TEMP/$release-source"
            rm -rf "$release_parent"
            mkdir -p "$release_parent"
            git archive --format=tar.gz --prefix=content/ "$release" -o "$RUNNER_TEMP/$release-tag.tar.gz"
            tar -xzf "$RUNNER_TEMP/$release-tag.tar.gz" -C "$release_parent"
            ln -sfn "$GITHUB_WORKSPACE/node_modules" "$release_parent/content/node_modules"
          done
          # The official Runtime ZIP's only differing member is package.json, which
          # is mapped from distribution/runtime-package.json at that tag.
          cp "$RUNNER_TEMP/v1.3.1-source/content/distribution/runtime-package.json" \
             "$RUNNER_TEMP/v1.3.1-source/content/package.json"
          (
            cd "$RUNNER_TEMP/v1.3.0-source/content"
            node scripts/build_showcase.js --no-previews
          )
          (
            cd "$RUNNER_TEMP/v1.3.1-source/content"
            node scripts/build_showcase.js --no-previews
          )
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const base = process.env.RUNNER_TEMP;
          const v130 = JSON.parse(fs.readFileSync(path.join(base, 'v1.3.0-source/content/out/v1.3-showcase/showcase.manifest.json'), 'utf8'));
          if (v130.version !== '1.3.0') throw new Error('V1.3.0 baseline showcase version is not 1.3.0');
          if (!(v130.matrix.status === 'PASS' && v130.gallery.status === 'PASS' && v130.ledger.status === 'PASS')) throw new Error('A V1.3.0 baseline suite is not PASS');
          const v131 = JSON.parse(fs.readFileSync(path.join(base, 'v1.3.1-source/content/out/v1.3-showcase/showcase.manifest.json'), 'utf8'));
          if (v131.version !== '1.3.1') throw new Error('V1.3.1 baseline showcase version is not 1.3.1');
          if (!(v131.matrix.status === 'PASS' && v131.gallery.status === 'PASS' && v131.ledger.status === 'PASS')) throw new Error('A V1.3.1 baseline suite is not PASS');
          JS
          curl --fail --location --proto "=https" --tlsv1.2 \
            "https://github.com/one-drop888/goujian-strategy-slides/releases/download/v1.3.0/goujian-strategy-slides-v1.3.0.zip" \
            --output "$RUNNER_TEMP/goujian-v1.3.0-installer.zip"
          printf '7df25c241d74c3bb34fc5569e021320fec675bded72c1e44d439a6f8485ad519  %s\n' "$RUNNER_TEMP/goujian-v1.3.0-installer.zip" | sha256sum --check -
          curl --fail --location --proto "=https" --tlsv1.2 \
            "https://github.com/one-drop888/goujian-strategy-slides/releases/download/v1.3.1/goujian-strategy-slides-v1.3.1.zip" \
            --output "$RUNNER_TEMP/goujian-v1.3.1-installer.zip"
          printf '7ee0d15488368a876ac2624546f72a13de8bdf01f322ed1055bb8c099d67b3dd  %s\n' "$RUNNER_TEMP/goujian-v1.3.1-installer.zip" | sha256sum --check -
          python3 scripts/capability_parity.py \
            "$RUNNER_TEMP/v1.3.0-source/content" "$RUNNER_TEMP/v1.3.1-source/content" \
            --baseline-zip "$RUNNER_TEMP/goujian-v1.3.0-installer.zip" \
            --contract CAPABILITY_PARITY_V1_3_0_TO_V1_3_1 \
            --json out/capability-parity-v130-v131.json
          python3 scripts/capability_parity.py \
            "$RUNNER_TEMP/v1.3.1-source/content" "$GITHUB_WORKSPACE" \
            --baseline-zip "$RUNNER_TEMP/goujian-v1.3.1-installer.zip" \
            --contract CAPABILITY_PARITY_V1_3_1_TO_V1_3_2 \
            --json out/capability-parity-v131-v132.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          checks = (
              ('out/capability-parity-v130-v131.json', 'CAPABILITY_PARITY_V1_3_0_TO_V1_3_1', '1.3.0', '1.3.1'),
              ('out/capability-parity-v131-v132.json', 'CAPABILITY_PARITY_V1_3_1_TO_V1_3_2', '1.3.1', '1.3.2'),
          )
          for path, contract, baseline, candidate in checks:
              result = json.loads(Path(path).read_text(encoding='utf-8'))
              assert result['status'] == 'PASS', (path, result['failures'])
              assert result['capability_parity'] == contract, (path, result['capability_parity'])
              assert result['baseline']['version'] == baseline, (path, result['baseline']['version'])
              assert result['candidate']['version'] == candidate, (path, result['candidate']['version'])
              assert result['visual_review'] == 'NOT_RUN', path
              assert result['company_platform_security'] == 'NOT_VERIFIED', path
          print('PASS: V1.3.0 -> V1.3.1 and V1.3.1 -> V1.3.2 capability parity')
          PY
      - name: Keep tracked source clean before packaging
        if: matrix.node == 24
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'PASS: showcase generation changed no tracked file'
      - name: Package and preflight the actual runtime and source archives
        run: |
          set -euo pipefail
          mkdir -p out dist
          python3 scripts/package_runtime.py dist/runtime.zip --json > out/runtime-package.json
          python3 scripts/package_runtime.py dist/source.zip --source --json > out/source-package.json
          python3 - <<'PY'
          import json, subprocess, zipfile
          from pathlib import Path
          prefix = 'goujian-strategy-slides/'
          mapping_path = Path('distribution/runtime-package.json')
          mapping = json.loads(mapping_path.read_text(encoding='utf-8'))
          root_package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          for field in ('name', 'version', 'license', 'dependencies', 'engines', 'overrides', 'repository'):
              assert mapping.get(field) == root_package.get(field), f'runtime package mapping differs for {field}'
          def verify(path, mapped_package):
              with zipfile.ZipFile(Path(path)) as archive:
                  names = archive.namelist()
                  assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
                  for name in names:
                      relative = name[len(prefix):] if name.startswith(prefix) else None
                      assert relative, f'archive member outside the declared prefix: {name}'
                      if relative == 'package.json' and mapped_package:
                          expected = mapping_path.read_bytes()
                      else:
                          expected = subprocess.run(['git', 'show', f'HEAD:{relative}'],
                                                    check=True, capture_output=True).stdout
                      assert archive.read(name) == expected, f'{relative} differs from HEAD'
                  return len(names)
          runtime_count = verify('dist/runtime.zip', True)
          source_count = verify('dist/source.zip', False)
          print(f'PASS: runtime={runtime_count} source={source_count} members match HEAD; package.json mapped only for runtime')
          PY
          python3 scripts/security_preflight.py dist/runtime.zip --profile runtime --strict-manifest --json out/runtime-preflight.json
          python3 scripts/security_preflight.py dist/source.zip --profile source --json out/source-preflight.json
      - name: Accept the extracted candidate source archive with the full original suite
        if: matrix.node == 24
        run: |
          set -euo pipefail
          archive_root="$RUNNER_TEMP/goujian-source-acceptance"
          rm -rf "$archive_root"
          python3 - "$archive_root" dist/source.zip <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          target = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          prefix = 'goujian-strategy-slides/'
          with zipfile.ZipFile(archive) as source:
              infos = source.infolist()
              names = [info.filename for info in infos]
              assert names and len(names) == len(set(names))
              assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
              for info in infos:
                  name = info.filename
                  assert name.startswith(prefix), f'member outside the declared prefix: {name}'
                  assert not info.is_dir(), f'unexpected directory entry: {name}'
                  mode = (info.external_attr >> 16) & 0xFFFF
                  assert not stat.S_ISLNK(mode), f'symlink member: {name}'
                  relative = name[len(prefix):]
                  assert not relative.startswith(('node_modules/', '.venv/', 'out/', 'dist/')), f'install-state member: {name}'
              target.mkdir(parents=True)
              source.extractall(target)
          print(f'PASS: extracted {len(names)} source members without install state or symlinks')
          PY
          source_root="$archive_root/goujian-strategy-slides"
          test -f "$source_root/scripts/runtime_acceptance.py"
          test -f "$source_root/tests/test_runtime_acceptance.py"
          test -f "$source_root/security/review-ledger.json"
          test -f "$source_root/.github/workflows/release.yml"
          cd "$source_root"
          npm ci
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/source-archive-test.log"
          npm_test_status=("${PIPESTATUS[@]}")
          set -e
          test "${npm_test_status[0]}" -eq 0
          test "${npm_test_status[1]}" -eq 0
          cp "$RUNNER_TEMP/source-archive-test.log" "$GITHUB_WORKSPACE/out/source-archive-test.log"
          python3 - "$GITHUB_WORKSPACE/dist/source.zip" "$source_root" "$RUNNER_TEMP/source-archive-test.log" "$GITHUB_WORKSPACE/out/source-archive-acceptance.json" '1.3.2' "${npm_test_status[0]}" "${npm_test_status[1]}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          source_root = Path(sys.argv[2])
          log = Path(sys.argv[3])
          receipt_path = Path(sys.argv[4])
          version = sys.argv[5]
          npm_status = int(sys.argv[6])
          tee_status = int(sys.argv[7])
          package = json.loads((source_root / 'package.json').read_text(encoding='utf-8'))
          log_bytes = log.read_bytes()
          log_text = log_bytes.decode('utf-8')
          assert package['version'] == version, (package['version'], version)
          assert log_text.strip(), 'the full source suite produced no output'
          assert npm_status == 0, f'npm test exited {npm_status}'
          assert tee_status == 0, f'test log capture (tee) exited {tee_status}'
          for relative in ('scripts/package_runtime.py', 'scripts/security_preflight.py',
                           'scripts/runtime_acceptance.py', 'tests/test_runtime_acceptance.py',
                           'skill/reasoning/fixtures/hostile-source/plan.json',
                           'skill/reasoning/fixtures/hostile-source/sources/hostile.md'):
              assert (source_root / relative).is_file(), relative
          receipt = {
              'schema_version': version,
              'status': 'PASS',
              'gate': 'extracted_source_archive_full_suite',
              'archive': {'file': archive.name,
                          'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()},
              'source_version': package['version'],
              'test_command': 'npm test',
              'test_exit_statuses': {'npm': npm_status, 'tee': tee_status},
              'test_log_sha256': hashlib.sha256(log_bytes).hexdigest(),
              'source_only_members_present': True,
              'required_source_files_present': True,
              'installed_runtime_execution': False,
              'visual_qa': 'NOT_RUN',
              'company_platform_security': 'NOT_VERIFIED',
          }
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('PASS: the extracted candidate source archive passed the full original suite')
          PY
      - name: Accept the actual installed candidate runtime against the locked v1.3.1 runtime
        if: matrix.node == 24
        run: |
          set -euo pipefail
          candidate_parent="$RUNNER_TEMP/goujian-candidate-runtime"
          baseline_parent="$RUNNER_TEMP/goujian-baseline-runtime"
          rm -rf "$candidate_parent" "$baseline_parent"
          python3 - "$candidate_parent" dist/runtime.zip "$baseline_parent" "$RUNNER_TEMP/goujian-v1.3.1-installer.zip" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          prefix = 'goujian-strategy-slides/'
          def extract(target, archive):
              target = Path(target)
              with zipfile.ZipFile(Path(archive)) as source:
                  infos = source.infolist()
                  names = [info.filename for info in infos]
                  assert names and len(names) == len(set(names))
                  assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
                  for info in infos:
                      name = info.filename
                      assert name.startswith(prefix), f'member outside the declared prefix: {name}'
                      assert not info.is_dir(), f'unexpected directory entry: {name}'
                      mode = (info.external_attr >> 16) & 0xFFFF
                      assert not stat.S_ISLNK(mode), f'symlink member: {name}'
                      relative = name[len(prefix):]
                      assert not relative.startswith(('node_modules/', '.venv/', 'out/', 'dist/')), f'install-state member: {name}'
                  target.mkdir(parents=True)
                  source.extractall(target)
              return len(names)
          candidate = extract(sys.argv[1], sys.argv[2])
          baseline = extract(sys.argv[3], sys.argv[4])
          assert candidate == 186, candidate
          print(f'PASS: extracted candidate runtime ({candidate} members) and the locked v1.3.1 baseline ({baseline} members)')
          PY
          candidate_root="$candidate_parent/goujian-strategy-slides"
          baseline_root="$baseline_parent/goujian-strategy-slides"
          empty_npmrc="$RUNNER_TEMP/goujian-empty-npmrc"
          : > "$empty_npmrc"
          (
            cd "$candidate_root"
            export NPM_CONFIG_USERCONFIG="$empty_npmrc"
            python3 scripts/bootstrap.py --python "$(command -v python3)" --json > "$RUNNER_TEMP/candidate-bootstrap.json"
          )
          python3 - "$RUNNER_TEMP/candidate-bootstrap.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['status'] == 'READY', data
          assert data['tier'] == 'secure', data['tier']
          assert data['secure_image'] == 'AVAILABLE', data['secure_image']
          print(f"PASS: the candidate runtime clean install used isolated Pillow {data['pillow']}")
          PY
          "$candidate_root/.venv/bin/python" scripts/runtime_acceptance.py \
            --source-root "$GITHUB_WORKSPACE" \
            --runtime-root "$candidate_root" \
            --baseline-zip "$RUNNER_TEMP/goujian-v1.3.1-installer.zip" \
            --baseline-root "$baseline_root" \
            --node-modules "$GITHUB_WORKSPACE/node_modules" \
            --artifact-dir "$GITHUB_WORKSPACE/out/runtime-acceptance-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --json out/runtime-acceptance.json > "$RUNNER_TEMP/runtime-acceptance-stdout.json"
          python3 - "$GITHUB_WORKSPACE/out/runtime-acceptance.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result['status'] == 'PASS', result['failures']
          assert result['capability_parity'] == 'CAPABILITY_PARITY_V1_3_1_TO_V1_3_2'
          assert result['contract']['candidate_version'] == '1.3.2', result['contract']
          assert result['contract']['baseline_version'] == '1.3.1', result['contract']
          execution = result['execution']
          assert execution['installed_runtime_cli'] is True
          assert execution['imports_installed_code'] is False
          assert execution['injects_developer_overlay'] is False
          assert result['installed_runtime']['python']['isolated_prefix'] is True
          assert result['installed_runtime']['baseline']['evidence']['status'] == 'PASS'
          assert result['installed_runtime']['candidate']['evidence']['status'] == 'PASS'
          candidate_modules = result['installed_runtime']['candidate']['node_modules']
          assert candidate_modules['status'] == 'PASS', candidate_modules
          assert candidate_modules['owned'] is True, candidate_modules
          assert candidate_modules['source'] == 'root-owned', candidate_modules
          assert candidate_modules['dependencies_match_lock'] is True, candidate_modules
          baseline_modules = result['installed_runtime']['baseline']['node_modules']
          assert baseline_modules['status'] == 'PASS', baseline_modules
          assert baseline_modules['dependencies_match_lock'] is True, baseline_modules
          coverage = result['coverage']
          assert coverage['status'] == 'PASS', coverage
          matrix = coverage['matrix']
          assert matrix['cells'] == 96, matrix
          assert matrix['accepted'] == 72 and matrix['rejected'] == 24, matrix
          families = {'bar', 'column', 'line', 'area', 'pie', 'doughnut'}
          assert set(matrix['families']) == families, matrix['families']
          for theme in ('light', 'dark'):
              theme_cells = matrix['themes'][theme]
              assert theme_cells['accepted_cells'] == 36, theme_cells
              assert theme_cells['native_charts'] == 36, theme_cells
              assert set(theme_cells['families']) == families, theme_cells
              assert theme_cells['status'] == 'PASS', theme_cells
          rejections = matrix['rejections']
          assert rejections['status'] == 'PASS', rejections
          assert rejections['attempted'] == 24 and rejections['matched'] == 24, rejections
          assert rejections['by_code'] == {
              'CATEGORY_PALETTE_CAPACITY': 8, 'AREA_SINGLE_POINT': 2, 'AREA_MISSING': 2,
              'PIE_SINGLE_SERIES': 4, 'PIE_NONNEGATIVE': 4, 'PIE_MISSING': 4,
          }, rejections['by_code']
          multimodal = coverage['multimodal']
          assert multimodal['status'] == 'PASS', multimodal
          assert multimodal['embedded_images'] >= 9, multimodal
          assert multimodal['image_nodes'] >= 9, multimodal
          assert multimodal['embedded_image_nodes'] == multimodal['image_nodes'], multimodal
          analytics = coverage['analytics']
          assert analytics['status'] == 'PASS', analytics
          assert {item['recipe'] for item in analytics['recipes']} == {
              'business-performance', 'project-analytics', 'sales-conversion'}, analytics
          assert analytics['percentage_fields'] >= 3, analytics
          assert analytics['percentage_point_fields'] >= 1, analytics
          assert analytics['branches'] >= 1, analytics
          reasoning = coverage['reasoning']
          assert reasoning['status'] == 'PASS', reasoning
          assert {item['plan'] for item in reasoning['plans']} == {
              'q4-six-actions', 'multimodal-consolidation',
              'executive-incomplete-business'}, reasoning
          relationships = coverage['relationships']
          assert relationships['status'] == 'PASS', relationships
          assert set(relationships['cases']) == {
              'dated-timeline', 'dated-timeline-close', 'branch-swimlane', 'roadmap'}, relationships
          assert set(relationships['themes']) == {'light', 'dark'}, relationships
          assert relationships['outputs'] == 8, relationships
          assert len(result['comparisons']) == 20, sorted(result['comparisons'])
          for name, case in result['comparisons'].items():
              assert case['status'] == 'PASS', (name, case['failures'])
          assert result['artifacts']['retained_on_failure'] is True
          assert result['artifacts']['manifest_count'] > 0
          assert result['visual_qa'] == 'NOT_RUN', result['visual_qa']
          assert result['company_platform_security'] == 'NOT_VERIFIED'
          print('PASS: the installed candidate runtime matched the locked v1.3.1 runtime '
                'across the full case matrix, analytics, reasoning and relationship coverage')
          PY
      - name: Package and preflight the optional V1.3 showcase
        if: matrix.node == 24
        run: |
          set -euo pipefail
          python3 scripts/package_runtime.py dist/showcase.zip --showcase --json > out/showcase-package.json
          python3 - <<'PY'
          import json, subprocess, zipfile
          from pathlib import Path
          prefix = 'goujian-strategy-slides/'
          mapping_path = Path('distribution/runtime-package.json')
          with zipfile.ZipFile(Path('dist/showcase.zip')) as archive:
              names = archive.namelist()
              assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
              unexpected = [name for name in names
                            if name.startswith(prefix + 'out/') and not name.startswith(prefix + 'out/v1.3-showcase/')]
              assert not unexpected, f'unexpected generated output: {unexpected[:3]}'
              for name in names:
                  relative = name[len(prefix):] if name.startswith(prefix) else None
                  assert relative, f'archive member outside the declared prefix: {name}'
                  if relative.startswith('out/v1.3-showcase/'):
                      continue
                  if relative == 'package.json':
                      expected = mapping_path.read_bytes()
                  else:
                      expected = subprocess.run(['git', 'show', f'HEAD:{relative}'],
                                                check=True, capture_output=True).stdout
                  assert archive.read(name) == expected, f'{relative} differs from HEAD'
          print('PASS: showcase source matches HEAD with package.json mapped and only out/v1.3-showcase added')
          PY
          python3 scripts/security_preflight.py dist/showcase.zip --profile runtime --allow-showcase --json out/showcase-preflight.json
