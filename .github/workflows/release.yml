name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must be 1.3.2)"
        required: true
        type: string
      expected_sha:
        description: "Approved 40-character commit SHA on main"
        required: true
        type: string
      publish:
        description: "Create the tag and publish the Release. Default false is a non-publishing rehearsal."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate and security-gate (no mutation)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: "1.3.2"
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      V13_BASELINE_COMMIT: f592ff82b2399fb3e08f3d9128f92a1d82039065
      V13_BASELINE_TAG_OBJECT: 5af41b05281c043dded880fc2ffe19ddb69f667c
      V131_BASELINE_COMMIT: 25f269f8db333e27f23915ecb472eed6cb2709c6
      V131_BASELINE_TAG_OBJECT: 72df06c921a80bbe1128a0964f22e187811943c6
      V12_BASELINE_COMMIT: fb55b1cc92e52923027c2a5ad405d3ee92b42f25
      V12_BASELINE_TAG_OBJECT: 5a4fd156b7bb1daaf756489704ab420e68329cf5
    steps:
      - name: Validate dispatch inputs
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$VERSION" = "1.3.2"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved commit, remote main and V1.3.2 metadata
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$VERSION"
          test "$(node -p "require('./distribution/runtime-package.json').version")" = "$VERSION"
          test "$(node -p "require('./distribution/runtime-manifest.json').schema_version")" = "$VERSION"
          grep -q 'version: "1.3.2"' SKILL.md
      - name: Fetch and verify the immutable V1.3.0, V1.3.1 and V1.2.1 baselines
        run: |
          set -euo pipefail
          git fetch --tags origin
          for tag in v1.3.0 v1.3.1 v1.2.1; do
            test "$(git cat-file -t "refs/tags/$tag")" = tag
          done
          test "$(git rev-parse refs/tags/v1.3.0)" = "$V13_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.3.0^{commit}')" = "$V13_BASELINE_COMMIT"
          test "$(git rev-parse refs/tags/v1.3.1)" = "$V131_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.3.1^{commit}')" = "$V131_BASELINE_COMMIT"
          test "$(git rev-parse refs/tags/v1.2.1)" = "$V12_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.2.1^{commit}')" = "$V12_BASELINE_COMMIT"
          v13_parent="$RUNNER_TEMP/v1.3.0-source"
          v131_parent="$RUNNER_TEMP/v1.3.1-source"
          v12_parent="$RUNNER_TEMP/v1.2.1-source"
          rm -rf "$v13_parent" "$v131_parent" "$v12_parent"
          mkdir -p "$v13_parent" "$v131_parent" "$v12_parent"
          git archive --format=tar.gz --prefix=content/ 'v1.3.0' -o "$RUNNER_TEMP/v1.3.0-tag.tar.gz"
          git archive --format=tar.gz --prefix=content/ 'v1.3.1' -o "$RUNNER_TEMP/v1.3.1-tag.tar.gz"
          git archive --format=tar.gz --prefix=content/ 'v1.2.1' -o "$RUNNER_TEMP/v1.2.1-tag.tar.gz"
          tar -xzf "$RUNNER_TEMP/v1.3.0-tag.tar.gz" -C "$v13_parent"
          tar -xzf "$RUNNER_TEMP/v1.3.1-tag.tar.gz" -C "$v131_parent"
          tar -xzf "$RUNNER_TEMP/v1.2.1-tag.tar.gz" -C "$v12_parent"
          # The official Runtime ZIP at each tag differs from its Source tree only
          # in package.json, which is mapped from distribution/runtime-package.json.
          cp "$v131_parent/content/distribution/runtime-package.json" "$v131_parent/content/package.json"
          python3 - "$v13_parent" "$(sha256sum "$RUNNER_TEMP/v1.3.0-tag.tar.gz" | cut -d' ' -f1)" "$V13_BASELINE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          parent = Path(sys.argv[1])
          manifest = {
              'commit': sys.argv[3],
              'archive_sha256': sys.argv[2],
              'path': 'runner-temp/v1.3.0-source/content',
              'purpose': 'immutable V1.3.0 tag archive fetched in the runner for capability parity',
          }
          (parent / 'baseline-source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          python3 - "$v12_parent" "$(sha256sum "$RUNNER_TEMP/v1.2.1-tag.tar.gz" | cut -d' ' -f1)" "$V12_BASELINE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          parent = Path(sys.argv[1])
          manifest = {
              'commit': sys.argv[3],
              'archive_sha256': sys.argv[2],
              'path': 'runner-temp/v1.2.1-source/content',
              'purpose': 'immutable V1.2.1 tag archive fetched in the runner for the existing before/after comparison',
          }
          (parent / 'baseline-source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          test -f "$v13_parent/content/scripts/analyze.js"
          test -f "$v131_parent/content/scripts/analyze.js"
          test -f "$v12_parent/content/scripts/analyze.js"
          test "$(node -p "require('$v13_parent/content/package.json').version")" = "1.3.0"
          test "$(node -p "require('$v131_parent/content/package.json').version")" = "1.3.1"
          test "$(node -p "require('$v12_parent/content/package.json').version")" = "1.2.1"
          printf 'V13_BASELINE_ROOT=%s\n' "$v13_parent/content" >> "$GITHUB_ENV"
          printf 'V131_BASELINE_ROOT=%s\n' "$v131_parent/content" >> "$GITHUB_ENV"
          printf 'V12_BASELINE_ROOT=%s\n' "$v12_parent/content" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install declared Linux render prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fontconfig fonts-noto-core fonts-noto-cjk libreoffice-impress poppler-utils imagemagick
      - name: Clean install, test, build, benchmark, doctor and QA
        run: |
          set -euo pipefail
          mkdir -p out dist
          npm ci
          python3 -m pip install -r requirements-render.txt
          npm test
          npm run validate:example
          npm run build:example
          npm run benchmark -- --render
          npm run --silent doctor -- --json > out/release-doctor.json
          npm run qa:example
      - name: V1.3.2 showcase, relationships and exact V1.2.1 before/after
        run: |
          set -euo pipefail
          node scripts/build_showcase.js --no-previews --baseline-root "$V12_BASELINE_ROOT" | tee out/v13-release-showcase-summary.json
          node - <<'JS'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('out/v1.3-showcase/showcase.manifest.json', 'utf8'));
          if (manifest.version !== '1.3.2') throw new Error('showcase version is not 1.3.2');
          if (manifest.baseline?.version !== '1.2.1') throw new Error('baseline version is not 1.2.1');
          if (manifest.baseline?.declared_commit !== process.env.V12_BASELINE_COMMIT) throw new Error('V1.2.1 baseline commit does not match the immutable tag');
          if (!manifest.baseline?.immutable) throw new Error('V1.2.1 baseline source changed during the run');
          if (!(manifest.matrix.status === 'PASS' && manifest.gallery.status === 'PASS' && manifest.ledger.status === 'PASS')) throw new Error('a V1.3.2 suite is not PASS');
          if (manifest.matrix?.fixture_counts?.cells !== 96 || manifest.matrix?.fixture_counts?.accepted !== 72 || manifest.matrix?.fixture_counts?.rejected !== 24) throw new Error('the native chart matrix no longer reports 96/72/24 outcomes');
          if (!manifest.scenarios.length || !manifest.scenarios.every(item =>
            item.status === 'PASS' && ['PASS', 'PASS_WITH_NOTES'].includes(item.comparison.status) && item.comparison.same_raw_bytes === true)) {
            throw new Error('before/after evidence is incomplete or used different raw input bytes');
          }
          const relationships = JSON.parse(fs.readFileSync('out/v1.3-showcase/relationships/manifest.json', 'utf8'));
          if (relationships.status !== 'PASS' || relationships.outputs.length !== 8) throw new Error('relationship evidence is incomplete');
          if (relationships.visual_qa !== 'NOT_RUN') throw new Error('relationship evidence must not claim a visual pass');
          const preview = JSON.parse(fs.readFileSync('docs/visual/v1.3/preview-manifest.json', 'utf8'));
          if (preview.review.status !== 'NOT_RUN') throw new Error('preview review must remain NOT_RUN');
          const fingerprint = JSON.parse(fs.readFileSync('out/v1.3-showcase/engine-source-fingerprint.json', 'utf8'));
          if (preview.engine_source_fingerprint?.aggregate_sha256 !== fingerprint.aggregate_sha256) throw new Error('checked-in previews were not built from the approved engine source');
          JS
      - name: Tagged V1.3.0/V1.3.1 baselines and both capability parity contracts
        run: |
          set -euo pipefail
          for baseline_root in "$V13_BASELINE_ROOT" "$V131_BASELINE_ROOT"; do
            ln -sfn "$GITHUB_WORKSPACE/node_modules" "$baseline_root/node_modules"
            (
              cd "$baseline_root"
              node scripts/build_showcase.js --no-previews
            )
          done
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const v130 = JSON.parse(fs.readFileSync(path.join(process.env.V13_BASELINE_ROOT, 'out/v1.3-showcase/showcase.manifest.json'), 'utf8'));
          if (v130.version !== '1.3.0') throw new Error('V1.3.0 baseline showcase version is not 1.3.0');
          if (!(v130.matrix.status === 'PASS' && v130.gallery.status === 'PASS' && v130.ledger.status === 'PASS')) throw new Error('a V1.3.0 baseline suite is not PASS');
          if (v130.matrix?.fixture_counts?.cells !== 96 || v130.matrix?.fixture_counts?.accepted !== 72 || v130.matrix?.fixture_counts?.rejected !== 24) throw new Error('the V1.3.0 matrix no longer reports 96/72/24 outcomes');
          const v131 = JSON.parse(fs.readFileSync(path.join(process.env.V131_BASELINE_ROOT, 'out/v1.3-showcase/showcase.manifest.json'), 'utf8'));
          if (v131.version !== '1.3.1') throw new Error('V1.3.1 baseline showcase version is not 1.3.1');
          if (!(v131.matrix.status === 'PASS' && v131.gallery.status === 'PASS' && v131.ledger.status === 'PASS')) throw new Error('a V1.3.1 baseline suite is not PASS');
          if (v131.matrix?.fixture_counts?.cells !== 96 || v131.matrix?.fixture_counts?.accepted !== 72 || v131.matrix?.fixture_counts?.rejected !== 24) throw new Error('the V1.3.1 matrix no longer reports 96/72/24 outcomes');
          JS
          for release in v1.3.0 v1.3.1; do
            curl --fail --location --proto "=https" --tlsv1.2 \
              "https://github.com/one-drop888/goujian-strategy-slides/releases/download/$release/goujian-strategy-slides-$release.zip" \
              --output "$RUNNER_TEMP/goujian-$release-installer.zip"
          done
          printf '7df25c241d74c3bb34fc5569e021320fec675bded72c1e44d439a6f8485ad519  %s\n' "$RUNNER_TEMP/goujian-v1.3.0-installer.zip" | sha256sum --check -
          printf '7ee0d15488368a876ac2624546f72a13de8bdf01f322ed1055bb8c099d67b3dd  %s\n' "$RUNNER_TEMP/goujian-v1.3.1-installer.zip" | sha256sum --check -
          python3 scripts/capability_parity.py "$V13_BASELINE_ROOT" "$V131_BASELINE_ROOT" \
            --baseline-zip "$RUNNER_TEMP/goujian-v1.3.0-installer.zip" \
            --contract CAPABILITY_PARITY_V1_3_0_TO_V1_3_1 \
            --json out/release-capability-parity-v130-v131.json
          python3 scripts/capability_parity.py "$V131_BASELINE_ROOT" "$GITHUB_WORKSPACE" \
            --baseline-zip "$RUNNER_TEMP/goujian-v1.3.1-installer.zip" \
            --contract CAPABILITY_PARITY_V1_3_1_TO_V1_3_2 \
            --json out/release-capability-parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          checks = (
              ('out/release-capability-parity-v130-v131.json',
               'CAPABILITY_PARITY_V1_3_0_TO_V1_3_1', '1.3.0', '1.3.1'),
              ('out/release-capability-parity.json',
               'CAPABILITY_PARITY_V1_3_1_TO_V1_3_2', '1.3.1', '1.3.2'),
          )
          for path, contract, baseline, candidate in checks:
              result = json.loads(Path(path).read_text(encoding='utf-8'))
              assert result['status'] == 'PASS', (path, result['failures'])
              assert result['capability_parity'] == contract, (path, result['capability_parity'])
              assert result['baseline']['version'] == baseline, (path, result['baseline']['version'])
              assert result['candidate']['version'] == candidate, (path, result['candidate']['version'])
              assert result['visual_review'] == 'NOT_RUN', path
              assert result['company_platform_security'] == 'NOT_VERIFIED', path
          print('PASS: V1.3.0 -> V1.3.1 and V1.3.1 -> V1.3.2 capability parity; visual review remains NOT_RUN')
          PY
      - name: Keep tracked source clean before packaging or tagging
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'PASS: generation changed no tracked file'
      - name: Build runtime, full source and optional showcase archives
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          python3 scripts/package_runtime.py --json > out/release-runtime-package.json
          python3 scripts/package_runtime.py --source --json > out/release-source-package.json
          python3 scripts/package_runtime.py --showcase --json > out/release-showcase-package.json
          python3 - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path
          prefix = 'goujian-strategy-slides/'
          expected_sha = os.environ['EXPECTED_SHA']
          root_package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          mapping_path = Path('distribution/runtime-package.json')
          mapping = json.loads(mapping_path.read_text(encoding='utf-8'))
          for field in ('name', 'version', 'license', 'dependencies', 'engines', 'overrides', 'repository'):
              assert mapping.get(field) == root_package.get(field), f'runtime package mapping differs for {field}'
          def git_bytes(relative):
              return subprocess.run(['git', 'show', f'{expected_sha}:{relative}'],
                                    check=True, capture_output=True).stdout
          def verify(path, mapped_package, generated_prefix=None):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  assert names, f'{path} is empty'
                  assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
                  assert len(names) == len(set(names))
                  for name in names:
                      relative = name[len(prefix):] if name.startswith(prefix) else None
                      assert relative, f'member outside the declared prefix: {name}'
                      if generated_prefix and relative.startswith(generated_prefix):
                          continue
                      if relative == 'package.json' and mapped_package:
                          expected = mapping_path.read_bytes()
                      else:
                          expected = git_bytes(relative)
                      assert archive.read(name) == expected, f'{relative} differs from the approved commit'
                  return len(names)
          runtime = Path('dist/goujian-strategy-slides-v1.3.2.zip')
          source = Path('dist/goujian-strategy-slides-v1.3.2-source.zip')
          showcase = Path('dist/goujian-strategy-slides-v1.3.2-showcase.zip')
          runtime_count = verify(runtime, True)
          source_count = verify(source, False)
          showcase_count = verify(showcase, True, generated_prefix='out/v1.3-showcase/')
          with zipfile.ZipFile(showcase) as archive:
              names = archive.namelist()
              assert prefix + 'out/v1.3-showcase/REVIEW_ARTIFACT.md' in names
              unexpected = [name for name in names
                            if name.startswith(prefix + 'out/')
                            and not name.startswith(prefix + 'out/v1.3-showcase/')]
              assert not unexpected, f'unexpected generated output: {unexpected[:3]}'
          print(f'PASS: runtime={runtime_count} source={source_count} showcase={showcase_count} members match {expected_sha}, with package.json mapped only for runtime/showcase')
          PY
      - name: Verify deterministic archives and single Skill entry
        run: |
          set -euo pipefail
          python3 scripts/package_runtime.py out/release-rebuild-runtime.zip --json > out/release-rebuild-runtime.json
          python3 scripts/package_runtime.py out/release-rebuild-source.zip --source --json > out/release-rebuild-source.json
          python3 scripts/package_runtime.py out/release-rebuild-showcase.zip --showcase --json > out/release-rebuild-showcase.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          pairs = [
              ('dist/goujian-strategy-slides-v1.3.2.zip', 'out/release-rebuild-runtime.zip'),
              ('dist/goujian-strategy-slides-v1.3.2-source.zip', 'out/release-rebuild-source.zip'),
              ('dist/goujian-strategy-slides-v1.3.2-showcase.zip', 'out/release-rebuild-showcase.zip'),
          ]
          for first, second in pairs:
              left = hashlib.sha256(Path(first).read_bytes()).hexdigest()
              right = hashlib.sha256(Path(second).read_bytes()).hexdigest()
              assert left == right, f'{first} is not byte-reproducible'
          print('PASS: runtime, source and showcase archives are byte-reproducible')
          PY
      - name: Preflight the actual runtime, source and showcase archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/security_preflight.py "dist/goujian-strategy-slides-v$VERSION.zip" --profile runtime --strict-manifest --json out/release-runtime-preflight.json
          python3 scripts/security_preflight.py "dist/goujian-strategy-slides-v$VERSION-source.zip" --profile source --json out/release-source-preflight.json
          python3 scripts/security_preflight.py "dist/goujian-strategy-slides-v$VERSION-showcase.zip" --profile runtime --allow-showcase --json out/release-showcase-preflight.json
      - name: Accept the extracted candidate source archive with the full original suite
        run: |
          set -euo pipefail
          archive_root="$RUNNER_TEMP/goujian-source-acceptance"
          rm -rf "$archive_root"
          python3 - "$archive_root" "dist/goujian-strategy-slides-v$VERSION-source.zip" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          target = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          prefix = 'goujian-strategy-slides/'
          with zipfile.ZipFile(archive) as source:
              infos = source.infolist()
              names = [info.filename for info in infos]
              assert names and len(names) == len(set(names))
              assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
              for info in infos:
                  name = info.filename
                  assert name.startswith(prefix), f'member outside the declared prefix: {name}'
                  assert not info.is_dir(), f'unexpected directory entry: {name}'
                  mode = (info.external_attr >> 16) & 0xFFFF
                  assert not stat.S_ISLNK(mode), f'symlink member: {name}'
                  relative = name[len(prefix):]
                  assert not relative.startswith(('node_modules/', '.venv/', 'out/', 'dist/')), f'install-state member: {name}'
              target.mkdir(parents=True)
              source.extractall(target)
          print(f'PASS: extracted {len(names)} source members without install state or symlinks')
          PY
          source_root="$archive_root/goujian-strategy-slides"
          test -f "$source_root/scripts/runtime_acceptance.py"
          test -f "$source_root/tests/test_runtime_acceptance.py"
          test -f "$source_root/security/review-ledger.json"
          test -f "$source_root/.github/workflows/release.yml"
          cd "$source_root"
          npm ci
          python3 -m pip install -r requirements-render.txt
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/source-archive-test.log"
          npm_test_status=("${PIPESTATUS[@]}")
          set -e
          test "${npm_test_status[0]}" -eq 0
          test "${npm_test_status[1]}" -eq 0
          python3 - "$GITHUB_WORKSPACE/dist/goujian-strategy-slides-v$VERSION-source.zip" "$source_root" "$RUNNER_TEMP/source-archive-test.log" "$GITHUB_WORKSPACE/out/release-source-archive-acceptance.json" "$VERSION" "${npm_test_status[0]}" "${npm_test_status[1]}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          source_root = Path(sys.argv[2])
          log = Path(sys.argv[3])
          receipt_path = Path(sys.argv[4])
          version = sys.argv[5]
          npm_status = int(sys.argv[6])
          tee_status = int(sys.argv[7])
          package = json.loads((source_root / 'package.json').read_text(encoding='utf-8'))
          log_text = log.read_text(encoding='utf-8')
          assert package['version'] == version, (package['version'], version)
          assert log_text.strip(), 'the full source suite produced no output'
          assert npm_status == 0, f'npm test exited {npm_status}'
          assert tee_status == 0, f'test log capture (tee) exited {tee_status}'
          for relative in ('scripts/package_runtime.py', 'scripts/security_preflight.py',
                           'scripts/runtime_acceptance.py', 'tests/test_runtime_acceptance.py',
                           'skill/reasoning/fixtures/hostile-source/plan.json',
                           'skill/reasoning/fixtures/hostile-source/sources/hostile.md'):
              assert (source_root / relative).is_file(), relative
          receipt = {
              'schema_version': version,
              'status': 'PASS',
              'gate': 'extracted_source_archive_full_suite',
              'archive': {'file': archive.name,
                          'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()},
              'source_version': package['version'],
              'test_command': 'npm test',
              'test_exit_statuses': {'npm': npm_status, 'tee': tee_status},
              'test_log_sha256': hashlib.sha256(log_text.encode('utf-8')).hexdigest(),
              'source_only_members_present': True,
              'required_source_files_present': True,
              'installed_runtime_execution': False,
              'visual_qa': 'NOT_RUN',
              'company_platform_security': 'NOT_VERIFIED',
          }
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('PASS: the extracted candidate source archive passed the full original suite')
          PY
      - name: Extract the actual runtime ZIP for a pre-tag clean install
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/构见-runtime-clean-install-v$VERSION"
          rm -rf "$install_root"
          python3 - "$install_root" "dist/goujian-strategy-slides-v$VERSION.zip" <<'PY'
          import json
          import stat
          import sys
          import zipfile
          from pathlib import Path

