      - name: Live public advisory check (fails closed on service errors)
        run: |
          set -euo pipefail
          mkdir -p out/security-gate/advisory
          set +e
          npm audit --omit=dev --json > out/security-gate/advisory/npm-audit.json
          npm_status=$?
          set -e
          printf '%s\n' "$npm_status" > out/security-gate/advisory/npm-audit-exit-code.txt
          python3 scripts/advisory_check.py \
            --npm-audit-json out/security-gate/advisory/npm-audit.json \
            --npm-audit-exit-code "$npm_status" \
