name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must be 1.3.1)"
        required: true
        type: string
      expected_sha:
        description: "Approved 40-character commit SHA on main"
        required: true
        type: string
      publish:
        description: "Create the tag and publish the Release. Default false is a non-publishing rehearsal."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate and security-gate (no mutation)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: "1.3.1"
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      V13_BASELINE_COMMIT: f592ff82b2399fb3e08f3d9128f92a1d82039065
      V13_BASELINE_TAG_OBJECT: 5af41b05281c043dded880fc2ffe19ddb69f667c
      V12_BASELINE_COMMIT: fb55b1cc92e52923027c2a5ad405d3ee92b42f25
      V12_BASELINE_TAG_OBJECT: 5a4fd156b7bb1daaf756489704ab420e68329cf5
    steps:
      - name: Validate dispatch inputs
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$VERSION" = "1.3.1"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved commit, remote main and V1.3.1 metadata
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$VERSION"
          test "$(node -p "require('./distribution/runtime-package.json').version")" = "$VERSION"
          test "$(node -p "require('./distribution/runtime-manifest.json').schema_version")" = "$VERSION"
          grep -q 'version: "1.3.1"' SKILL.md
      - name: Fetch and verify the immutable V1.3.0 and V1.2.1 baselines
        run: |
          set -euo pipefail
          git fetch --tags origin
          test "$(git cat-file -t refs/tags/v1.3.0)" = tag
          test "$(git rev-parse refs/tags/v1.3.0)" = "$V13_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.3.0^{commit}')" = "$V13_BASELINE_COMMIT"
          test "$(git cat-file -t refs/tags/v1.2.1)" = tag
          test "$(git rev-parse refs/tags/v1.2.1)" = "$V12_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.2.1^{commit}')" = "$V12_BASELINE_COMMIT"
          v13_parent="$RUNNER_TEMP/v1.3.0-source"
          v12_parent="$RUNNER_TEMP/v1.2.1-source"
          rm -rf "$v13_parent" "$v12_parent"
          mkdir -p "$v13_parent" "$v12_parent"
          git archive --format=tar.gz --prefix=content/ 'v1.3.0' -o "$RUNNER_TEMP/v1.3.0-tag.tar.gz"
          git archive --format=tar.gz --prefix=content/ 'v1.2.1' -o "$RUNNER_TEMP/v1.2.1-tag.tar.gz"
          tar -xzf "$RUNNER_TEMP/v1.3.0-tag.tar.gz" -C "$v13_parent"
          tar -xzf "$RUNNER_TEMP/v1.2.1-tag.tar.gz" -C "$v12_parent"
          python3 - "$v13_parent" "$(sha256sum "$RUNNER_TEMP/v1.3.0-tag.tar.gz" | cut -d' ' -f1)" "$V13_BASELINE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          parent = Path(sys.argv[1])
          manifest = {
              'commit': sys.argv[3],
              'archive_sha256': sys.argv[2],
              'path': 'runner-temp/v1.3.0-source/content',
              'purpose': 'immutable V1.3.0 tag archive fetched in the runner for capability parity',
          }
          (parent / 'baseline-source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          python3 - "$v12_parent" "$(sha256sum "$RUNNER_TEMP/v1.2.1-tag.tar.gz" | cut -d' ' -f1)" "$V12_BASELINE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          parent = Path(sys.argv[1])
          manifest = {
              'commit': sys.argv[3],
              'archive_sha256': sys.argv[2],
              'path': 'runner-temp/v1.2.1-source/content',
              'purpose': 'immutable V1.2.1 tag archive fetched in the runner for the existing before/after comparison',
          }
          (parent / 'baseline-source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          test -f "$v13_parent/content/scripts/analyze.js"
          test -f "$v12_parent/content/scripts/analyze.js"
          test "$(node -p "require('$v13_parent/content/package.json').version")" = "1.3.0"
          test "$(node -p "require('$v12_parent/content/package.json').version")" = "1.2.1"
          printf 'V13_BASELINE_ROOT=%s\n' "$v13_parent/content" >> "$GITHUB_ENV"
          printf 'V12_BASELINE_ROOT=%s\n' "$v12_parent/content" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install declared Linux render prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fontconfig fonts-noto-core fonts-noto-cjk libreoffice-impress poppler-utils imagemagick
      - name: Clean install, test, build, benchmark, doctor and QA
        run: |
          set -euo pipefail
          mkdir -p out dist
          npm ci
          python3 -m pip install -r requirements-render.txt
          npm test
          npm run validate:example
          npm run build:example
          npm run benchmark -- --render
          npm run --silent doctor -- --json > out/release-doctor.json
          npm run qa:example
      - name: V1.3.1 showcase, relationships and exact V1.2.1 before/after
        run: |
          set -euo pipefail
          node scripts/build_showcase.js --no-previews --baseline-root "$V12_BASELINE_ROOT" | tee out/v13-release-showcase-summary.json
          node - <<'JS'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('out/v1.3-showcase/showcase.manifest.json', 'utf8'));
          if (manifest.version !== '1.3.1') throw new Error('showcase version is not 1.3.1');
          if (manifest.baseline?.version !== '1.2.1') throw new Error('baseline version is not 1.2.1');
          if (manifest.baseline?.declared_commit !== process.env.V12_BASELINE_COMMIT) throw new Error('V1.2.1 baseline commit does not match the immutable tag');
          if (!manifest.baseline?.immutable) throw new Error('V1.2.1 baseline source changed during the run');
          if (!(manifest.matrix.status === 'PASS' && manifest.gallery.status === 'PASS' && manifest.ledger.status === 'PASS')) throw new Error('a V1.3.1 suite is not PASS');
          if (manifest.matrix?.fixture_counts?.cells !== 96 || manifest.matrix?.fixture_counts?.accepted !== 72 || manifest.matrix?.fixture_counts?.rejected !== 24) throw new Error('the native chart matrix no longer reports 96/72/24 outcomes');
          if (!manifest.scenarios.length || !manifest.scenarios.every(item =>
            item.status === 'PASS' && ['PASS', 'PASS_WITH_NOTES'].includes(item.comparison.status) && item.comparison.same_raw_bytes === true)) {
            throw new Error('before/after evidence is incomplete or used different raw input bytes');
          }
          const relationships = JSON.parse(fs.readFileSync('out/v1.3-showcase/relationships/manifest.json', 'utf8'));
          if (relationships.status !== 'PASS' || relationships.outputs.length !== 8) throw new Error('relationship evidence is incomplete');
          if (relationships.visual_qa !== 'NOT_RUN') throw new Error('relationship evidence must not claim a visual pass');
          const preview = JSON.parse(fs.readFileSync('docs/visual/v1.3/preview-manifest.json', 'utf8'));
          if (preview.review.status !== 'NOT_RUN') throw new Error('preview review must remain NOT_RUN');
          const fingerprint = JSON.parse(fs.readFileSync('out/v1.3-showcase/engine-source-fingerprint.json', 'utf8'));
          if (preview.engine_source_fingerprint?.aggregate_sha256 !== fingerprint.aggregate_sha256) throw new Error('checked-in previews were not built from the approved engine source');
          JS
      - name: V1.3.0 tagged baseline showcase and capability parity
        run: |
          set -euo pipefail
          ln -sfn "$GITHUB_WORKSPACE/node_modules" "$V13_BASELINE_ROOT/node_modules"
          (
            cd "$V13_BASELINE_ROOT"
            node scripts/build_showcase.js --no-previews
          )
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const baseline = JSON.parse(fs.readFileSync(path.join(process.env.V13_BASELINE_ROOT, 'out/v1.3-showcase/showcase.manifest.json'), 'utf8'));
          if (baseline.version !== '1.3.0') throw new Error('V1.3.0 baseline showcase version is not 1.3.0');
          if (!(baseline.matrix.status === 'PASS' && baseline.gallery.status === 'PASS' && baseline.ledger.status === 'PASS')) throw new Error('a V1.3.0 baseline suite is not PASS');
          if (baseline.matrix?.fixture_counts?.cells !== 96 || baseline.matrix?.fixture_counts?.accepted !== 72 || baseline.matrix?.fixture_counts?.rejected !== 24) throw new Error('the V1.3.0 matrix no longer reports 96/72/24 outcomes');
          JS
          curl --fail --location --proto "=https" --tlsv1.2 \
            "https://github.com/one-drop888/goujian-strategy-slides/releases/download/v1.3.0/goujian-strategy-slides-v1.3.0.zip" \
            --output "$RUNNER_TEMP/goujian-v1.3.0-installer.zip"
          printf '7df25c241d74c3bb34fc5569e021320fec675bded72c1e44d439a6f8485ad519  %s\n' "$RUNNER_TEMP/goujian-v1.3.0-installer.zip" | sha256sum --check -
          python3 scripts/capability_parity.py "$V13_BASELINE_ROOT" "$GITHUB_WORKSPACE" --baseline-zip "$RUNNER_TEMP/goujian-v1.3.0-installer.zip" --json out/release-capability-parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('out/release-capability-parity.json').read_text(encoding='utf-8'))
          assert result['status'] == 'PASS', result['failures']
          assert result['capability_parity'] == 'CAPABILITY_PARITY_V1_3_0_TO_V1_3_1'
          assert result['baseline']['version'] == '1.3.0'
          assert result['candidate']['version'] == '1.3.1'
          assert result['visual_review'] == 'NOT_RUN'
          assert result['company_platform_security'] == 'NOT_VERIFIED'
          print('PASS: V1.3.0 -> V1.3.1 capability parity; visual review remains NOT_RUN')
          PY
      - name: Keep tracked source clean before packaging or tagging
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'PASS: generation changed no tracked file'
      - name: Build runtime, full source and optional showcase archives
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          python3 scripts/package_runtime.py --json > out/release-runtime-package.json
          python3 scripts/package_runtime.py --source --json > out/release-source-package.json
          python3 scripts/package_runtime.py --showcase --json > out/release-showcase-package.json
          python3 - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path
          prefix = 'goujian-strategy-slides/'
          expected_sha = os.environ['EXPECTED_SHA']
          root_package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          mapping_path = Path('distribution/runtime-package.json')
          mapping = json.loads(mapping_path.read_text(encoding='utf-8'))
          for field in ('name', 'version', 'license', 'dependencies', 'engines', 'overrides', 'repository'):
              assert mapping.get(field) == root_package.get(field), f'runtime package mapping differs for {field}'
          def git_bytes(relative):
              return subprocess.run(['git', 'show', f'{expected_sha}:{relative}'],
                                    check=True, capture_output=True).stdout
          def verify(path, mapped_package, generated_prefix=None):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  assert names, f'{path} is empty'
                  assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
                  assert len(names) == len(set(names))
                  for name in names:
                      relative = name[len(prefix):] if name.startswith(prefix) else None
                      assert relative, f'member outside the declared prefix: {name}'
                      if generated_prefix and relative.startswith(generated_prefix):
                          continue
                      if relative == 'package.json' and mapped_package:
                          expected = mapping_path.read_bytes()
                      else:
                          expected = git_bytes(relative)
                      assert archive.read(name) == expected, f'{relative} differs from the approved commit'
                  return len(names)
          runtime = Path('dist/goujian-strategy-slides-v1.3.1.zip')
          source = Path('dist/goujian-strategy-slides-v1.3.1-source.zip')
          showcase = Path('dist/goujian-strategy-slides-v1.3.1-showcase.zip')
          runtime_count = verify(runtime, True)
          source_count = verify(source, False)
          showcase_count = verify(showcase, True, generated_prefix='out/v1.3-showcase/')
          with zipfile.ZipFile(showcase) as archive:
              names = archive.namelist()
              assert prefix + 'out/v1.3-showcase/REVIEW_ARTIFACT.md' in names
              unexpected = [name for name in names
                            if name.startswith(prefix + 'out/')
                            and not name.startswith(prefix + 'out/v1.3-showcase/')]
              assert not unexpected, f'unexpected generated output: {unexpected[:3]}'
          print(f'PASS: runtime={runtime_count} source={source_count} showcase={showcase_count} members match {expected_sha}, with package.json mapped only for runtime/showcase')
          PY
      - name: Verify deterministic archives and single Skill entry
        run: |
          set -euo pipefail
          python3 scripts/package_runtime.py out/release-rebuild-runtime.zip --json > out/release-rebuild-runtime.json
          python3 scripts/package_runtime.py out/release-rebuild-source.zip --source --json > out/release-rebuild-source.json
          python3 scripts/package_runtime.py out/release-rebuild-showcase.zip --showcase --json > out/release-rebuild-showcase.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          pairs = [
              ('dist/goujian-strategy-slides-v1.3.1.zip', 'out/release-rebuild-runtime.zip'),
              ('dist/goujian-strategy-slides-v1.3.1-source.zip', 'out/release-rebuild-source.zip'),
              ('dist/goujian-strategy-slides-v1.3.1-showcase.zip', 'out/release-rebuild-showcase.zip'),
          ]
          for first, second in pairs:
              left = hashlib.sha256(Path(first).read_bytes()).hexdigest()
              right = hashlib.sha256(Path(second).read_bytes()).hexdigest()
              assert left == right, f'{first} is not byte-reproducible'
          print('PASS: runtime, source and showcase archives are byte-reproducible')
          PY
      - name: Preflight the actual runtime, source and showcase archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/security_preflight.py "dist/goujian-strategy-slides-v$VERSION.zip" --profile runtime --strict-manifest --json out/release-runtime-preflight.json
          python3 scripts/security_preflight.py "dist/goujian-strategy-slides-v$VERSION-source.zip" --profile source --json out/release-source-preflight.json
          python3 scripts/security_preflight.py "dist/goujian-strategy-slides-v$VERSION-showcase.zip" --profile runtime --allow-showcase --json out/release-showcase-preflight.json
      - name: Extract the actual runtime ZIP for a pre-tag clean install
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/构见-runtime-clean-install-v$VERSION"
          rm -rf "$install_root"
          python3 - "$install_root" "dist/goujian-strategy-slides-v$VERSION.zip" <<'PY'
          import json
          import stat
          import sys
          import zipfile
          from pathlib import Path

          target = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          prefix = 'goujian-strategy-slides/'
          with zipfile.ZipFile(archive) as source:
              infos = source.infolist()
              names = [info.filename for info in infos]
              assert names and len(names) == len(set(names))
              assert [name for name in names if name.endswith('/SKILL.md')] == [prefix + 'SKILL.md']
              for info in infos:
                  name = info.filename
                  assert name.startswith(prefix), f'member outside the declared prefix: {name}'
                  assert not info.is_dir(), f'unexpected directory entry: {name}'
                  mode = (info.external_attr >> 16) & 0xFFFF
                  assert not stat.S_ISLNK(mode), f'symlink member: {name}'
                  relative = name[len(prefix):]
                  assert not relative.startswith(('node_modules/', '.venv/', 'out/', 'dist/')), f'install-state member: {name}'
              target.mkdir(parents=True)
              source.extractall(target)
          root = target / 'goujian-strategy-slides'
          assert root.is_dir()
          assert not (root / 'node_modules').exists()
          assert not (root / '.venv').exists()
          assert not (root / '.github').exists()
          assert not (root / 'tests/test_capability_parity.py').exists()
          manifest = json.loads((root / 'distribution/runtime-manifest.json').read_text(encoding='utf-8'))
          files = manifest['runtime_files']
          assert manifest['distribution'] == 'runtime'
          assert len(files) == 189 and len(set(files)) == 189
          assert 'package.json' not in files
          assert len(names) == 190
          assert (root / 'package.json').read_bytes() == (root / 'distribution/runtime-package.json').read_bytes()
          print(f'PASS: extracted {len(names)} runtime members into a Unicode directory; no node_modules, .venv, symlink or development overlay')
          PY
          printf 'RUNTIME_INSTALL_ROOT=%s\n' "$install_root" >> "$GITHUB_ENV"
          cd "$install_root/goujian-strategy-slides"
          test -z "$(find . -type l -print -quit)"
          test ! -e node_modules
          test ! -e .venv
          python3 - "$PWD" "$RUNNER_TEMP/production-hashes-before.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          excluded = {'node_modules', '.venv', 'out', 'dist', 'build', '__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache', '.cache', '.qoder'}
          files = {}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              parts = relative.split('/')
              if any(part in excluded for part in parts) or relative == 'package.json' or relative.endswith('.pyc'):
                  continue
              files[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert len(files) == 189, len(files)
          payload = {
              'count': len(files),
              'package_json_excluded': 'mapped development metadata; must equal distribution/runtime-package.json and must not be restored or overlaid',
              'files': files,
          }
          Path(sys.argv[2]).write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'PASS: recorded {len(files)} protected runtime production hashes before bootstrap')
          PY
      - name: Bootstrap the pre-tag runtime clean install and assert Doctor
        run: |
          set -euo pipefail
          cd "$RUNTIME_INSTALL_ROOT/goujian-strategy-slides"
          empty_npmrc="$RUNNER_TEMP/goujian-empty-npmrc"
          : > "$empty_npmrc"
          export NPM_CONFIG_USERCONFIG="$empty_npmrc"
          python3 scripts/bootstrap.py --dry-run --json > "$RUNNER_TEMP/bootstrap-dry.json"
          python3 - "$RUNNER_TEMP/bootstrap-dry.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['status'] == 'DRY_RUN', data
          assert data['tier'] == 'secure', data['tier']
          actions = {action['step']: action for action in data['actions']}
          assert actions['npm-ci']['status'] == 'PLANNED', actions['npm-ci']
          assert actions['venv']['status'] == 'PLANNED', actions['venv']
          assert actions['pip-install']['status'] == 'PLANNED', actions['pip-install']
          print('PASS: Bootstrap dry-run plans locked npm ci, an isolated .venv and secure Pillow')
          PY
          python3 scripts/bootstrap.py --json > "$RUNNER_TEMP/bootstrap-real.json"
          python3 - "$RUNNER_TEMP/bootstrap-real.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['status'] == 'READY', data
          assert data['tier'] == 'secure', data['tier']
          assert data['secure_image'] == 'AVAILABLE', data['secure_image']
          actions = {action['step']: action for action in data['actions']}
          assert actions['npm-ci']['status'] == 'OK', actions['npm-ci']
          assert actions['venv']['status'] == 'OK', actions['venv']
          assert actions['pip-install']['status'] == 'OK', actions['pip-install']
          pillow = tuple(int(value) for value in re.findall(r'\d+', str(data.get('pillow')))[:3])
          assert pillow >= (13, 0, 0), data.get('pillow')
          print(f"PASS: Bootstrap installed locked npm dependencies and isolated Pillow {data['pillow']} with Python {data['python_version']}")
          PY
          python3 scripts/bootstrap.py --json > "$RUNNER_TEMP/bootstrap-idempotent.json"
          python3 - "$RUNNER_TEMP/bootstrap-idempotent.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['status'] == 'READY', data
          actions = {action['step']: action for action in data['actions']}
          assert actions['npm-ci']['status'] == 'SKIPPED', actions['npm-ci']
          assert actions['venv']['status'] == 'SKIPPED', actions['venv']
          assert actions['pip-install']['status'] == 'SKIPPED', actions['pip-install']
          print('PASS: a second Bootstrap run skipped the already verified npm, venv and Pillow state')
          PY
          . .venv/bin/activate
          python3 - <<'PY'
          import sys
          import PIL
          assert sys.prefix != sys.base_prefix, sys.prefix
          print(f'PASS: secure runtime commands use isolated {sys.prefix} with Pillow {PIL.__version__}')
          PY
          npm run --silent doctor -- --json > "$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['status'] in {'READY', 'READY_WITH_NOTES'}, data['status']
          checks = {check['id']: check for check in data['checks']}
          for check_id in ('platform', 'node', 'npm', 'python', 'js-dependencies', 'venv', 'pillow',
                           'secure-image', 'libreoffice', 'poppler', 'fonts'):
              assert checks[check_id]['status'] == 'PRESENT', (check_id, checks[check_id])
          assert checks['secure-image']['detected']['status'] == 'AVAILABLE', checks['secure-image']
          assert data['visual_qa'] == 'NOT_RUN', data['visual_qa']
          assert data['capabilities']['VISUAL_QA'] == 'NOT_RUN', data['capabilities']['VISUAL_QA']
          assert 'presence/version only' in data['note'], data['note']
          print('PASS: Doctor reports the isolated secure tier and locked dependencies; VISUAL_QA=NOT_RUN')
          PY
      - name: Run installed-runtime smoke, documented tasks and all recipes
        run: |
          set -euo pipefail
          cd "$RUNTIME_INSTALL_ROOT/goujian-strategy-slides"
          . .venv/bin/activate
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/goujian-empty-npmrc"
          npm test | tee "$RUNNER_TEMP/runtime-smoke-secure.log"
