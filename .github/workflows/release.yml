  publish:
    name: Publish Release (explicit publish=true only)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: "1.3.2"
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      V13_BASELINE_COMMIT: f592ff82b2399fb3e08f3d9128f92a1d82039065
      V13_BASELINE_TAG_OBJECT: 5af41b05281c043dded880fc2ffe19ddb69f667c
      V131_BASELINE_COMMIT: 25f269f8db333e27f23915ecb472eed6cb2709c6
      V131_BASELINE_TAG_OBJECT: 72df06c921a80bbe1128a0964f22e187811943c6
      V12_BASELINE_COMMIT: fb55b1cc92e52923027c2a5ad405d3ee92b42f25
      V12_BASELINE_TAG_OBJECT: 5a4fd156b7bb1daaf756489704ab420e68329cf5
    steps:
      - name: Validate publish inputs
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$VERSION" = "1.3.2"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's validated archives and security receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Set up Python 3.14 for the isolated PDF verifier
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install only the hash-locked PDF verifier from the shared lock
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          verifier_root="$RUNNER_TEMP/goujian-pdf-verifier"
          rm -rf "$verifier_root"
          python3 -m venv "$verifier_root"
          "$verifier_root/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple \
            -r security/pdf-parser-requirements.txt
          "$verifier_root/bin/python" -c "import pypdf; assert pypdf.__version__ == '6.21.3', pypdf.__version__"
          echo "PDF_VERIFIER_PYTHON=$verifier_root/bin/python" >> "$GITHUB_ENV"
      - name: Re-verify approvals, hashes, receipts and same-run binding before any mutation
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./distribution/runtime-package.json').version")" = "$VERSION"
          grep -q 'version: "1.3.2"' SKILL.md
          python3 - "$VERSION" "$EXPECTED_SHA" "$RUN_ID" "$RUN_ATTEMPT" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          version, commit, run_id, run_attempt = sys.argv[1:5]
          binding = json.loads(Path('out/security-gate/run-binding.json').read_text(encoding='utf-8'))
          assert binding['run_id'] == run_id, (binding['run_id'], run_id)
          assert binding['run_attempt'] == run_attempt, (binding['run_attempt'], run_attempt)
          assert binding['commit'] == commit, (binding['commit'], commit)
          assert binding['version'] == version, (binding['version'], version)
          manifest = json.loads(Path('dist/release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['commit'] == commit, manifest['commit']
          assert manifest['version'] == version, manifest['version']
          runtime_acceptance = manifest.get('runtime_acceptance') or {}
          source_acceptance = manifest.get('source_archive_acceptance') or {}
          for label, section, report in (
              ('runtime acceptance', runtime_acceptance, 'release-runtime-acceptance.json'),
              ('source archive acceptance', source_acceptance,
               'release-source-archive-acceptance.json'),
          ):
              assert section.get('status') == 'PASS', (label, section)
              path = Path('dist') / report
              assert path.is_file(), path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == section['report_sha256'], label
          assert runtime_acceptance.get('contract') == 'CAPABILITY_PARITY_V1_3_1_TO_V1_3_2'
          assert runtime_acceptance.get('coverage', {}).get('status') == 'PASS', runtime_acceptance
          assert runtime_acceptance['coverage']['matrix_cells'] == 96, runtime_acceptance
          assert runtime_acceptance['coverage']['matrix_accepted'] == 72, runtime_acceptance
          assert runtime_acceptance['coverage']['matrix_rejected'] == 24, runtime_acceptance
          assert runtime_acceptance['coverage']['rejected_by_code'] == {
              'CATEGORY_PALETTE_CAPACITY': 8, 'AREA_SINGLE_POINT': 2, 'AREA_MISSING': 2,
              'PIE_SINGLE_SERIES': 4, 'PIE_NONNEGATIVE': 4, 'PIE_MISSING': 4,
          }, runtime_acceptance['coverage']
          assert runtime_acceptance['coverage']['multimodal_embedded_images'] >= 9
          assert len(runtime_acceptance['coverage']['analytics_recipes']) == 3
          assert len(runtime_acceptance['coverage']['reasoning_plans']) == 3
          assert len(runtime_acceptance['coverage']['relationship_cases']) == 4
          assert runtime_acceptance['coverage']['relationship_outputs'] == 8
          assert runtime_acceptance['evidence_artifacts']['retained_on_failure'] is True
          assert runtime_acceptance['evidence_artifacts']['manifest_count'] > 0
          assert runtime_acceptance.get('visual_qa') == 'NOT_RUN'
          assert runtime_acceptance.get('company_platform_security') == 'NOT_VERIFIED'
          assert source_acceptance.get('full_original_suite') is True
          security = manifest.get('security')
          assert isinstance(security, dict), 'external manifest has no security section'
          assert security['status'] == 'PASS', security['status']
          assert security['workflow_run'] == {'run_id': run_id,
                                              'run_attempt': run_attempt}, security['workflow_run']
          assert security['advisory']['status'] == 'PASS', security['advisory']
          index_path = Path('dist') / security['evidence_index']['file']
          assert index_path.is_file(), index_path
          index_sha = hashlib.sha256(index_path.read_bytes()).hexdigest()
          assert index_sha == security['evidence_index']['sha256'], 'security evidence index changed'
          assert set(security['profiles']) == {'runtime', 'source', 'showcase'}
          for name, profile in security['profiles'].items():
              receipt = Path('out/security-gate') / name / 'receipt.json'
              assert receipt.is_file(), receipt
              assert hashlib.sha256(receipt.read_bytes()).hexdigest() == \
                  profile['receipt']['sha256'], f'{name} receipt changed'
              assert profile['status'] == 'PASS', (name, profile['status'])
          print('PASS: same-run binding, approved commit, manifest and hash-bound security evidence agree')
          PY
          for name in runtime source showcase; do
            case "$name" in
              runtime) archive="dist/goujian-strategy-slides-v$VERSION.zip" ;;
              source) archive="dist/goujian-strategy-slides-v$VERSION-source.zip" ;;
              showcase) archive="dist/goujian-strategy-slides-v$VERSION-showcase.zip" ;;
            esac
            test -f "$archive"
            sha="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$archive")"
            "$PDF_VERIFIER_PYTHON" scripts/scan_skill_package.py verify "out/security-gate/$name/receipt.json" \
              --archive "$archive" \
              --expected-sha256 "$sha" \
              --version "$VERSION" \
              --commit "$EXPECTED_SHA" \
              --repo "$GITHUB_WORKSPACE" \
              --config security/security-gate.json \
              --lock security/requirements-lock.txt \
              --review-ledger security/review-ledger.json \
              --artifact-dir "out/security-gate/$name"
          done
      - name: Stop before overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to overwrite assets or history." >&2
            exit 1
          fi
      - name: Create annotated tag if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          git diff --exit-code
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          test "$(git cat-file -t refs/tags/v1.3.0)" = tag
          test "$(git rev-parse refs/tags/v1.3.0)" = "$V13_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.3.0^{commit}')" = "$V13_BASELINE_COMMIT"
          test "$(git cat-file -t refs/tags/v1.2.1)" = tag
          test "$(git rev-parse refs/tags/v1.2.1)" = "$V12_BASELINE_TAG_OBJECT"
          test "$(git rev-parse 'v1.2.1^{commit}')" = "$V12_BASELINE_COMMIT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            test "$(git cat-file -t "refs/tags/v$VERSION")" = tag
            test "$(git rev-parse "v$VERSION^{commit}")" = "$EXPECTED_SHA"
          else
            git config user.name 'Goujian release automation'
            git config user.email 'noreply@github.com'
            git tag -a "v$VERSION" "$EXPECTED_SHA" -m "Goujian Strategy Slides v$VERSION"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION"
          fi
          test "$(git rev-parse "v$VERSION^{commit}")" = "$EXPECTED_SHA"
          remote_tag="$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)"
          test -n "$remote_tag"
          test "$remote_tag" = "$(git rev-parse "refs/tags/v$VERSION")"
      - name: Publish runtime, source, optional showcase, checksums and external evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)" = "$(git rev-parse "refs/tags/v$VERSION")"
          cd dist
          sha256sum "goujian-strategy-slides-v$VERSION.zip" "goujian-strategy-slides-v$VERSION-source.zip" "goujian-strategy-slides-v$VERSION-showcase.zip" > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['commit'] == os.environ['EXPECTED_SHA']
          for artifact in manifest['artifacts'].values():
              actual = hashlib.sha256(Path(artifact['file']).read_bytes()).hexdigest()
              assert actual == artifact['sha256'], f"{artifact['file']} changed after the release manifest was written"
          security = manifest.get('security') or {}
          assert security.get('status') == 'PASS', 'release manifest has no passing security evidence'
          index = Path(security['evidence_index']['file'])
          assert index.is_file(), index
          assert hashlib.sha256(index.read_bytes()).hexdigest() == \
              security['evidence_index']['sha256'], 'security evidence index changed'
          for name, profile in security['profiles'].items():
              assert profile['status'] == 'PASS', (name, profile['status'])
          print('PASS: external manifest still matches the exact ZIP bytes and security evidence')
          PY
          gh release create "v$VERSION" --verify-tag \
            --title "Goujian Strategy Slides v$VERSION" \
            --notes-file ../docs/V1_3_2_RELEASE_NOTES.md \
            "goujian-strategy-slides-v$VERSION.zip" \
            "goujian-strategy-slides-v$VERSION-source.zip" \
            "goujian-strategy-slides-v$VERSION-showcase.zip" \
            SHA256SUMS.txt release-manifest.json security-evidence.json \
            release-runtime-preflight.json release-source-preflight.json release-showcase-preflight.json \
            release-runtime-package.json release-source-package.json release-showcase-package.json \
            release-capability-parity.json release-capability-parity-v130-v131.json \
            release-runtime-clean-install.json \
            release-runtime-acceptance.json release-source-archive-acceptance.json
      - name: Verify a fresh clone of the published tag and a clean runtime install
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v$VERSION" "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/goujian-remote-verify"
          cd "$RUNNER_TEMP/goujian-remote-verify"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm ci
          python3 -m pip install -r requirements-render.txt
          npm test
          npm run validate:example
          npm run build:example
          npm run qa:example
          npm run package
          npm run package:source
          python3 scripts/security_preflight.py "dist/goujian-strategy-slides-v$VERSION.zip" --profile runtime --strict-manifest --json out/fresh-clone-preflight.json
          python3 scripts/security_preflight.py "dist/goujian-strategy-slides-v$VERSION-source.zip" --profile source --json out/fresh-clone-source-preflight.json
          mkdir -p "$RUNNER_TEMP/runtime-install"
          python3 - "$RUNNER_TEMP/runtime-install" "$VERSION" <<'PY'
          import sys, zipfile
          from pathlib import Path
          target = Path(sys.argv[1])
          archive = Path(f'dist/goujian-strategy-slides-v{sys.argv[2]}.zip')
          with zipfile.ZipFile(archive) as source:
              source.extractall(target)
          print('extracted', archive)
          PY
          cd "$RUNNER_TEMP/runtime-install/goujian-strategy-slides"
          npm ci
          python3 -m pip install -r requirements-render.txt
          npm test
          npm run validate:all
          released_zip="$RUNNER_TEMP/goujian-remote-verify/dist/goujian-strategy-slides-v$VERSION.zip"
          digest="$(sha256sum "$released_zip" | cut -d' ' -f1)"
          python3 "$GITHUB_WORKSPACE/scripts/package_runtime.py" "$RUNNER_TEMP/runtime-install-rebuilt.zip" \
            --runtime-root "$PWD" --expect-sha256 "$digest" --json > "$RUNNER_TEMP/runtime-install-rebuilt.json"
          python3 - "$RUNNER_TEMP/runtime-install-rebuilt.json" "$digest" <<'PY'
          import json
          import sys
          from pathlib import Path
          rebuilt = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert rebuilt['entries'] == 186, rebuilt['entries']
          assert rebuilt['sha256'] == sys.argv[2], (rebuilt['sha256'], sys.argv[2])
          print('PASS: the installed published runtime repackages byte-identically from the Source packager')
          PY
          python3 "$GITHUB_WORKSPACE/scripts/security_preflight.py" "$released_zip" --profile runtime --strict-manifest --json out/runtime-install-preflight.json
