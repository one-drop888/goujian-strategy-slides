          npm_status=$?
          set -e
          printf '%s\n' "$npm_status" > out/security-gate/advisory/npm-audit-exit-code.txt
          python3 scripts/advisory_check.py \
            --npm-audit-json out/security-gate/advisory/npm-audit.json \
            --npm-audit-exit-code "$npm_status" \
            --out out/security-gate/advisory/osv-check.json
      - name: Set up Python 3.14 for the isolated security scanner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install the pinned scanner and PDF parser for the release security gate
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          scanner_root="$RUNNER_TEMP/goujian-release-scanner"
          rm -rf "$scanner_root"
          python3 -m venv "$scanner_root"
          "$scanner_root/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple \
            -r security/requirements-lock.txt
          "$scanner_root/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple \
            -r security/pdf-parser-requirements.txt
          "$scanner_root/bin/skill-scanner" --version
          "$scanner_root/bin/python" -c "import pypdf; assert pypdf.__version__ == '6.21.3', pypdf.__version__"
          "$scanner_root/bin/python" -m pip check
          echo "SCANNER_BIN=$scanner_root/bin/skill-scanner" >> "$GITHUB_ENV"
          echo "SCANNER_PYTHON=$scanner_root/bin/python" >> "$GITHUB_ENV"

      - name: Run the real-parser PDF structural suite before any release scan
        run: |
          set -euo pipefail
          "$SCANNER_PYTHON" -m unittest tests.test_pdf_structural_review -v
      - name: Security-gate the actual runtime, source and showcase archives
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p out/security-gate
          status=0
          run_scan() {
            local name="$1" profile="$2" archive="$3"
            local sha
            sha="$(sha256sum "$archive" | cut -d' ' -f1)"
            echo "::group::gate scan $name ($archive)"
            if "$SCANNER_PYTHON" scripts/scan_skill_package.py scan "$archive" \
                --profile "$profile" \
                --version "$VERSION" \
                --commit "$EXPECTED_SHA" \
                --repo "$GITHUB_WORKSPACE" \
                --source-tree-state clean \
                --expected-sha256 "$sha" \
                --scanner "$SCANNER_BIN" \
                --out-dir "out/security-gate/$name"; then
              echo "PASS: $name security gate"
            else
              echo "FAIL: $name security gate (see out/security-gate/$name)"
              status=1
            fi
            echo "::endgroup::"
          }
          run_scan runtime runtime "dist/goujian-strategy-slides-v$VERSION.zip"
          run_scan source source "dist/goujian-strategy-slides-v$VERSION-source.zip"
          run_scan showcase showcase "dist/goujian-strategy-slides-v$VERSION-showcase.zip"
          # Fail closed: any unreviewed HIGH/CRITICAL keeps the release red.
          exit "$status"
      - name: Verify all three receipts in the non-publishing rehearsal
