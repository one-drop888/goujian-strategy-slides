      - name: Set up Python 3.14 for the isolated security scanner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install the pinned scanner for the release security gate
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          scanner_root="$RUNNER_TEMP/goujian-release-scanner"
          rm -rf "$scanner_root"
          python3 -m venv "$scanner_root"
          "$scanner_root/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple \
            -r security/requirements-lock.txt
          "$scanner_root/bin/skill-scanner" --version
          "$scanner_root/bin/python" -m pip check
          echo "SCANNER_BIN=$scanner_root/bin/skill-scanner" >> "$GITHUB_ENV"
      - name: Security-gate the actual runtime, source and showcase archives
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p out/security-gate
          status=0
          run_scan() {
            local name="$1" profile="$2" archive="$3"
            local sha
            sha="$(sha256sum "$archive" | cut -d' ' -f1)"
            echo "::group::gate scan $name ($archive)"
            if python3 scripts/scan_skill_package.py scan "$archive" \
                --profile "$profile" \
                --version "$VERSION" \
                --commit "$EXPECTED_SHA" \
                --repo "$GITHUB_WORKSPACE" \
                --source-tree-state clean \
                --expected-sha256 "$sha" \
                --scanner "$SCANNER_BIN" \
                --out-dir "out/security-gate/$name"; then
              echo "PASS: $name security gate"
            else
              echo "FAIL: $name security gate (see out/security-gate/$name)"
              status=1
            fi
            echo "::endgroup::"
          }
          run_scan runtime runtime "dist/goujian-strategy-slides-v$VERSION.zip"
          run_scan source source "dist/goujian-strategy-slides-v$VERSION-source.zip"
          run_scan showcase showcase "dist/goujian-strategy-slides-v$VERSION-showcase.zip"
          # Fail closed: any unreviewed HIGH/CRITICAL keeps the release red.
          exit "$status"
      - name: Verify all three receipts in the non-publishing rehearsal
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          for name in runtime source showcase; do
            case "$name" in
              runtime) archive="dist/goujian-strategy-slides-v$VERSION.zip" ;;
              source) archive="dist/goujian-strategy-slides-v$VERSION-source.zip" ;;
              showcase) archive="dist/goujian-strategy-slides-v$VERSION-showcase.zip" ;;
            esac
            test -f "$archive"
            sha="$(sha256sum "$archive" | cut -d' ' -f1)"
            python3 scripts/scan_skill_package.py verify "out/security-gate/$name/receipt.json" \
              --archive "$archive" \
              --expected-sha256 "$sha" \
              --version "$VERSION" \
              --commit "$EXPECTED_SHA" \
              --repo "$GITHUB_WORKSPACE" \
              --config security/security-gate.json \
              --lock security/requirements-lock.txt \
              --review-ledger security/review-ledger.json \
              --artifact-dir "out/security-gate/$name"
          done
