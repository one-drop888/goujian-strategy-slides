          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          for name in runtime source showcase; do
            case "$name" in
              runtime) archive="dist/goujian-strategy-slides-v$VERSION.zip" ;;
              source) archive="dist/goujian-strategy-slides-v$VERSION-source.zip" ;;
              showcase) archive="dist/goujian-strategy-slides-v$VERSION-showcase.zip" ;;
            esac
            test -f "$archive"
            sha="$(sha256sum "$archive" | cut -d' ' -f1)"
            "$SCANNER_PYTHON" scripts/scan_skill_package.py verify "out/security-gate/$name/receipt.json" \
              --archive "$archive" \
              --expected-sha256 "$sha" \
              --version "$VERSION" \
              --commit "$EXPECTED_SHA" \
              --repo "$GITHUB_WORKSPACE" \
              --config security/security-gate.json \
              --lock security/requirements-lock.txt \
              --review-ledger security/review-ledger.json \
              --artifact-dir "out/security-gate/$name"
          done
      - name: Bind hash-bound security evidence into the external release manifest
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - "$RUN_ID" "$RUN_ATTEMPT" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          run_id, run_attempt = sys.argv[1:3]

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          advisory_path = Path('out/security-gate/advisory/osv-check.json')
          advisory = load(advisory_path)
          assert advisory['status'] == 'PASS', advisory['findings']
          assert advisory['findings'] == []
          profiles = {}
          for name in ('runtime', 'source', 'showcase'):
              root = Path('out/security-gate') / name
              receipt_path = root / 'receipt.json'
              assert receipt_path.is_file(), receipt_path
              receipt = load(receipt_path)
              assert receipt['status'] == 'PASS', (name, receipt['failure_reasons'])
              reports = receipt['reports']
              profiles[name] = {
                  'status': receipt['status'],
                  'archive_sha256': receipt['archive']['sha256'],
                  'receipt': {'path': str(receipt_path), 'sha256': sha(receipt_path)},
                  'scanner_json': {'file': reports['json']['file'],
                                   'sha256': reports['json']['sha256']},
                  'scanner_sarif': {'file': reports['sarif']['file'],
                                    'sha256': reports['sarif']['sha256']},
                  'review_ledger_sha256': receipt['review_ledger']['sha256'],
                  'review_proposal': receipt['review_ledger'].get('proposal'),
                  'config_sha256': receipt['config']['sha256'],
                  'lock_sha256': receipt['lock']['sha256'],
                  'snapshot_sha256': receipt['snapshot']['sha256'],
                  'source_identity': {
                      key: receipt['source_identity'][key]
                      for key in ('commit', 'profile', 'compared_members',
                                  'mapped_members', 'generated_exception',
                                  'member_digest_sha256')
                  },
              }
          security = {
              'status': 'PASS',
              'gate': 'GOUJIAN_SKILL_PACKAGE_SECURITY_GATE',
              'workflow_run': {'run_id': run_id, 'run_attempt': run_attempt},
              'artifact': {'name': 'release-validation-{}-{}'.format(run_id, run_attempt),
                           'retention_days': 90},
              'coverage': {'python': 'ANALYZED', 'bash': 'ANALYZED',
                           'javascript': 'NOT_RUN', 'semantic': 'NOT_RUN'},
              'tool_metadata': {
                  name: {'path': 'security/' + name,
                         'sha256': sha(Path('security') / name)}
                  for name in ('scanner-provenance.json', 'dependency-licenses.json')
              },
              'advisory': {
                  'status': advisory['status'],
                  'coordinates': advisory['coordinates']['total'],
                  'findings': len(advisory['findings']),
                  'report': {'path': str(advisory_path), 'sha256': sha(advisory_path)},
                  'osv': {
                      'endpoint': advisory['osv']['endpoint'],
                      'query_count': advisory['osv']['query_count'],
                      'request_sha256': advisory['osv']['request_sha256'],
                      'response_sha256': advisory['osv']['response_sha256'],
                      'started_at': advisory['osv']['started_at'],
                      'finished_at': advisory['osv']['finished_at'],
                      'elapsed_ms': advisory['osv']['elapsed_ms'],
                  },
                  'npm_audit': {
                      'report_sha256': advisory['sources']['npm_audit']['sha256'],
                      'metadata_vulnerabilities':
                          (advisory['npm_audit'] or {}).get('metadata_vulnerabilities'),
                  },
              },
              'profiles': profiles,
          }
          index_path = Path('dist/security-evidence.json')
          index_path.write_text(json.dumps(security, ensure_ascii=False, indent=2) + '\n',
                                encoding='utf-8')
          security['evidence_index'] = {'file': index_path.name,
                                        'sha256': sha(index_path)}
          manifest_path = Path('dist/release-manifest.json')
          manifest = load(manifest_path)
          manifest['security'] = security
          manifest['published'] = False
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
                                   encoding='utf-8')
          print('PASS: release manifest records hash-bound security evidence for all three profiles')
          PY
      - name: Record the same-run binding for the publisher
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def sha(path):
              candidate = Path(path)
              return hashlib.sha256(candidate.read_bytes()).hexdigest() if candidate.is_file() else None

          binding = {
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'workflow': os.environ.get('GITHUB_WORKFLOW'),
              'event': os.environ.get('GITHUB_EVENT_NAME'),
              'ref': os.environ.get('GITHUB_REF'),
              'commit': os.environ.get('EXPECTED_SHA'),
              'version': os.environ.get('VERSION'),
          }
          receipts = {}
          for name in ('runtime', 'source', 'showcase'):
              receipt_path = Path('out/security-gate') / name / 'receipt.json'
              if receipt_path.is_file():
                  receipts[name] = {
                      'status': json.loads(receipt_path.read_text(encoding='utf-8')).get('status'),
                      'sha256': sha(receipt_path),
                  }
          advisory_path = Path('out/security-gate/advisory/osv-check.json')
          advisory = json.loads(advisory_path.read_text(encoding='utf-8')) \
              if advisory_path.is_file() else {}
          binding['security'] = {
              'receipts': receipts,
              'advisory': advisory.get('status'),
              'advisory_sha256': sha(advisory_path),
          }
          Path('out/security-gate').mkdir(parents=True, exist_ok=True)
          Path('out/security-gate/run-binding.json').write_text(
              json.dumps(binding, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
